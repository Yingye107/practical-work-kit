name: Validate public package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate public boundaries and metadata
        run: python3 tools/validate.py
      - name: Verify rejection controls
        run: python3 -m unittest discover -s tests -v
      - name: Build and check the installable archive
        run: python3 tools/build_release.py --output dist
